# Development tooling only. The applet ships as plain files: nothing here is built or installed.
# Set up: python3 -m venv --system-site-packages .venv && .venv/bin/pip install --group dev

[dependency-groups]
dev = ["pytest", "ruff", "mypy"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["walldrift@markovic-nikola/files/walldrift@markovic-nikola", "."]
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.11"
mypy_path = "walldrift@markovic-nikola/files/walldrift@markovic-nikola"
files = ["walldrift@markovic-nikola/files/walldrift@markovic-nikola/walldrift", "tests"]

[[tool.mypy.overrides]]
module = ["gi", "gi.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["walldrift@markovic-nikola/files/walldrift@markovic-nikola"]
